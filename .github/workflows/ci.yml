name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install pinned Bicep CLI
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          $os = if ($IsWindows) { 'win' } elseif ($IsMacOS) { 'osx' } else { 'linux' }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $directory = Join-Path $env:RUNNER_TEMP 'bicep-cli'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $binary = Join-Path $directory "bicep$suffix"
          Invoke-WebRequest "https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-$os-$arch$suffix" -OutFile $binary
          if (!$IsWindows) { & chmod +x $binary }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: npm ci
      - name: Verify locked compiler dependencies
        run: dotnet restore native/Bicep.Formatter/Bicep.Formatter.csproj --locked-mode
      - run: npm run check
      - name: Measure production line and branch coverage
        if: runner.os == 'Linux'
        env:
          BICEPFLEX_TEST_NO_SANDBOX: "1"
        run: xvfb-run -a npm run test:coverage
      - run: npm run package --workspace=bicepflex
      - name: Download official grammar corpus
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/upstream | Out-Null
          Invoke-WebRequest 'https://github.com/Azure/bicep/archive/refs/tags/v0.47.16.tar.gz' -OutFile artifacts/upstream/bicep.tar.gz
          tar -xf artifacts/upstream/bicep.tar.gz -C artifacts/upstream bicep-0.47.16/src/Bicep.Core.Samples/Files
      - if: runner.os == 'Linux'
        run: npm run test:corpus
      - name: Standalone VSIX integration
        if: runner.os == 'Linux'
        env:
          BICEPFLEX_TEST_PACKAGED: "1"
          BICEPFLEX_TEST_NO_SANDBOX: "1"
        run: xvfb-run -a npm run test:host --workspace=bicepflex
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: marketplace-package
          path: packages/vscode/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: compatibility-results
          path: artifacts/corpus-results.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: production-coverage
          path: |
            artifacts/coverage/summary.json
            artifacts/coverage/native.xml
            artifacts/coverage/engine/coverage-summary.json
            artifacts/coverage/host/coverage-summary.json
          if-no-files-found: warn

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed extension version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content packages/vscode/package.json -Raw | ConvertFrom-Json).version
          $previous = (git show '${{ github.event.before }}:packages/vscode/package.json' | Out-String | ConvertFrom-Json).version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -ceq $previous) {
            Write-Host 'Extension version is unchanged; no release is needed.'
            exit 0
          }
          if ($version -cnotmatch '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "Unsupported Marketplace release version: $version"
          }
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists; never reuse a released version." }
          if ($LASTEXITCODE -ne 2) { throw "Could not check whether tag $tag already exists." }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  github-release:
    if: needs.prepare-release.outputs.tag != ''
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-package
          path: artifacts/marketplace
      - name: Create GitHub Release with tested VSIX
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $version = (Get-Content packages/vscode/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match the verified extension version.' }
          $packages = @(Get-ChildItem artifacts/marketplace -Filter *.vsix -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne "bicepflex-$version.vsix") {
            throw "Expected exactly one tested bicepflex-$version.vsix."
          }
          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:RELEASE_TAG already exists; never reuse a released version." }
          if ($LASTEXITCODE -ne 2) { throw "Could not check whether tag $env:RELEASE_TAG already exists." }
          gh release create $env:RELEASE_TAG $packages[0].FullName --title "BicepFlex $version" --target $env:GITHUB_SHA --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  marketplace:
    if: needs.github-release.result == 'success'
    needs: github-release
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.github-release.outputs.tag }}
