name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag version and main ancestry
        shell: pwsh
        run: |
          $version = (Get-Content packages/vscode/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match extension version v$version." }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-package
          path: artifacts/marketplace
      - name: Create GitHub Release with tested VSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content packages/vscode/package.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem artifacts/marketplace -Filter *.vsix -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne "bicepflex-$version.vsix") {
            throw "Expected exactly one tested bicepflex-$version.vsix."
          }
          gh release create $env:GITHUB_REF_NAME $packages[0].FullName --title "BicepFlex $version" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
